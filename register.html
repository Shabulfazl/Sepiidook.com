<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به فروشگاه</title>

    <!-- Bootstrap RTL -->
    <link href="css/bootstrap.rtl.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link href="css/all.css" rel="stylesheet">

    <!-- Css Custom -->
    <link rel="stylesheet" href="css/styles.css">

    <!-- Favicon -->
    <link rel="icon" href="image/svg/Wool-1-100x100.webp" sizes="32x32">

</head>

<body>
    <!-- =========================================
    LOGIN / REGISTER PAGE
    ========================================= -->
    <div class="auth-page">
        <div class="auth-container">
            <!-- Logo -->
            <div class="auth-logo">
                <img src="image/Sepidook-Blank-4.png.webp" alt="خرازی آنلاین" width="180px"
                    onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                <span style="display: none; font-size: 24px; font-weight: bold; color: var(--color-primary);">
                    خرازی آنلاین
                </span>
            </div>

            <!-- ===== STEP 1: ورود با شماره تلفن ===== -->
            <div class="auth-form" id="stepPhone">
                <h3 class="auth-title">ورود / ثبت‌نام</h3>
                <p class="auth-subtitle">برای ورود شماره تلفن خود را وارد کنید</p>

                <div class="form-group">
                    <label class="form-label">شماره تلفن</label>
                    <div class="input-wrapper">
                        <span class="input-prefix">۰۹</span>
                        <input type="tel" class="form-input" id="phoneInput"  maxlength="9"
                            inputmode="numeric" pattern="[0-9]*">
                    </div>
                </div>

                <button class="auth-btn" id="sendOtpBtn" disabled>
                    <i class="fa-regular fa-paper-plane"></i>
                    ارسال کد تایید
                </button>

                <p class="auth-footer-text">
                    با ورود و ثبت‌نام در خرازی آنلاین،
                    <a href="#">شرایط و قوانین</a> را می‌پذیرید.
                </p>
            </div>

            <!-- ===== STEP 2: وارد کردن کد OTP ===== -->
            <div class="auth-form" id="stepOtp" style="display: none;">
                <h3 class="auth-title">تایید کد</h3>
                <p class="auth-subtitle">
                    کد تایید به شماره
                    <strong id="otpPhoneDisplay">۰۹۱۲۳۴۵۶۷۸۹</strong>
                    ارسال شد
                </p>

                <div class="otp-container">
                    <input type="text" class="otp-input" id="otp1" maxlength="1" inputmode="numeric" pattern="[0-9]">
                    <input type="text" class="otp-input" id="otp2" maxlength="1" inputmode="numeric" pattern="[0-9]">
                    <input type="text" class="otp-input" id="otp3" maxlength="1" inputmode="numeric" pattern="[0-9]">
                    <input type="text" class="otp-input" id="otp4" maxlength="1" inputmode="numeric" pattern="[0-9]">
                    <input type="text" class="otp-input" id="otp5" maxlength="1" inputmode="numeric" pattern="[0-9]">
                </div>

                <div class="otp-timer">
                    <span class="timer-text">ارسال مجدد کد در</span>
                    <span class="timer-count" id="otpTimer">۶۰</span>
                    <span class="timer-text">ثانیه</span>
                </div>

                <button class="auth-btn" id="verifyOtpBtn">
                    <i class="fa-regular fa-check-circle"></i>
                    تایید کد
                </button>

                <button class="auth-back-btn" id="backToPhoneBtn">
                    <i class="fa-solid fa-chevron-right"></i>
                    تغییر شماره تلفن
                </button>
            </div>

            <!-- ===== STEP 3: ثبت‌نام (برای کاربران جدید) ===== -->
            <div class="auth-form" id="stepRegister" style="display: none;">
                <h3 class="auth-title">تکمیل ثبت‌نام</h3>
                <p class="auth-subtitle">لطفاً اطلاعات خود را تکمیل کنید</p>

                <div class="form-group">
                    <label class="form-label">نام و نام خانوادگی</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-user input-icon"></i>
                        <input type="text" class="form-input" id="registerName" placeholder="نام خود را وارد کنید">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">شماره تلفن</label>
                    <div class="input-wrapper">
                        <i class="fas fa-phone input-icon"></i>
                        <input type="tel" class="form-input" id="registerPhone" placeholder="شماره تلفن" readonly>
                    </div>
                </div>

                <button class="auth-btn" id="registerBtn">
                    <i class="fas fa-user-plus"></i>
                    ثبت‌نام
                </button>
            </div>
        </div>
    </div>
    <!-- Scripts -->
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- Bootstrap Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <!-- JS Custom -->
    <script src="js/scripts.js"></script>

</body>

</html>
